<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>대구 칠곡 편의시설 스마트 지도</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS for OpenStreetMap Tile Layer -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- Google Fonts: Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f1f5f9;
      touch-action: manipulation;
    }
    
    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* GPS Pulsing Blue Pin Effect */
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 0.9; }
      50% { transform: scale(1.4); opacity: 0.3; }
      100% { transform: scale(0.8); opacity: 0.9; }
    }
    .user-location-marker {
      position: relative;
    }
    .user-location-marker::after {
      content: '';
      position: absolute;
      top: -8px; left: -8px; right: -8px; bottom: -8px;
      border-radius: 50%;
      background-color: rgba(59, 130, 246, 0.45);
      animation: pulse-ring 2s infinite ease-in-out;
      z-index: -1;
    }

    /* Leaflet Popup & Control Overrides */
    .leaflet-popup-content-wrapper {
      padding: 0 !important;
      border-radius: 1.25rem !important;
      overflow: hidden;
      box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.18), 0 8px 12px -6px rgba(0, 0, 0, 0.12) !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 290px !important;
    }
    .leaflet-container {
      font-family: 'Noto Sans KR', sans-serif !important;
    }
    .leaflet-control-zoom {
      border: none !important;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12) !important;
      border-radius: 0.85rem !important;
      overflow: hidden;
    }
    .leaflet-control-zoom a {
      background-color: #ffffff !important;
      color: #334155 !important;
      border-bottom: 1px solid #f1f5f9 !important;
    }

    /* Hide scrollbar for category pills horizontally */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden text-slate-800 bg-slate-100">

  <!-- APP MAIN CONTAINER -->
  <div class="flex flex-col h-full w-full max-w-[1920px] mx-auto p-2 sm:p-3 md:p-4 gap-2.5">
    
    <!-- 1. TOP HEADER BAR -->
    <header class="bg-white rounded-2xl shadow-sm border border-slate-200/80 px-3.5 py-2.5 sm:px-4 sm:py-3 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2.5 sm:gap-3">
        <!-- Blue-Purple Gradient Location Pin Icon -->
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-500 flex items-center justify-center text-white shadow-md shadow-indigo-200 shrink-0">
          <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-sm sm:text-lg md:text-xl font-extrabold text-slate-900 tracking-tight leading-tight">대구 칠곡 편의시설 지도</h1>
          <p class="text-[11px] sm:text-xs text-slate-500 font-medium hidden sm:block">북구 칠곡(동천동, 구암동, 태전동, 학정동, 관음동 등) 종합 가이드</p>
        </div>
      </div>
      
      <!-- Right Action Group -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- Mobile View Toggle (Visible only on mobile) -->
        <button id="mobileViewToggle" onclick="toggleMobileView()" class="md:hidden flex items-center gap-1 px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition">
          <svg id="mobileToggleIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
          </svg>
          <span id="mobileToggleText">지도보기</span>
        </button>

        <!-- QR Share Button -->
        <button onclick="openQRModal()" class="flex items-center gap-1.5 px-3 py-1.5 sm:py-2 bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-600 text-xs sm:text-sm font-bold rounded-xl transition border border-indigo-100 shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/>
          </svg>
          <span>QR 공유</span>
        </button>
      </div>
    </header>

    <!-- 2. MAIN WORKSPACE: LEFT SIDEBAR + RIGHT MAP -->
    <div class="flex flex-col md:flex-row flex-1 gap-2.5 overflow-hidden relative">
      
      <!-- LEFT SIDEBAR PANEL (Filters & Facility List) -->
      <aside id="sidebarPanel" class="w-full md:w-96 lg:w-[410px] bg-white rounded-2xl border border-slate-200/80 shadow-sm flex flex-col overflow-hidden shrink-0 h-full z-10 transition-all duration-200">
        
        <!-- Search and Filter Header -->
        <div class="p-3.5 border-b border-slate-100 space-y-2.5 bg-white shrink-0">
          <!-- Search Bar -->
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </span>
            <input type="text" id="searchInput" onkeyup="filterPlaces()" placeholder="시설명, 동이름 검색 (예: 칠곡경대병원, CU)" 
              class="w-full pl-10 pr-4 py-2.5 bg-slate-50 hover:bg-slate-100/70 focus:bg-white text-xs sm:text-sm text-slate-800 placeholder-slate-400 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition duration-150">
          </div>

          <!-- Sort & Mode Bar -->
          <div class="flex items-center justify-between text-xs">
            <div class="flex items-center gap-1 font-semibold text-slate-500">
              <span id="resultCountText" class="text-indigo-600 font-bold">95</span>개 시설 검색됨
            </div>
            
            <div class="flex items-center gap-1.5">
              <!-- Sort Mode Toggle -->
              <button id="sortBtn" onclick="toggleSortMode()" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-bold flex items-center gap-1 transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"/>
                </svg>
                <span id="sortBtnLabel">기본순</span>
              </button>
            </div>
          </div>

          <!-- Category Pill Buttons -->
          <div class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar text-xs font-semibold" id="categoryPillContainer">
            <!-- Dynamically populated categories -->
          </div>
        </div>

        <!-- GPS Status Banner -->
        <div id="gpsBanner" class="hidden px-3.5 py-2 bg-indigo-50 border-b border-indigo-100 flex items-center justify-between text-xs text-indigo-700">
          <span class="flex items-center gap-1.5 font-bold">
            <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
            <span id="gpsBannerText">내 위치 기반 거리 표시 중</span>
          </span>
          <button onclick="clearGPS()" class="text-[11px] underline font-medium hover:text-indigo-900">해제</button>
        </div>

        <!-- Facility Cards List Container -->
        <div class="flex-1 overflow-y-auto p-3 space-y-2.5 bg-slate-50/50" id="facilityList">
          <!-- Dynamically populated cards -->
        </div>

        <!-- Sidebar Footer -->
        <div class="p-2.5 border-t border-slate-100 text-center text-[11px] font-medium text-slate-400 bg-white shrink-0 flex items-center justify-between px-4">
          <span>대구 북구 칠곡 공공 편의시설 서비스</span>
          <button onclick="simulateUserLocation()" class="text-indigo-600 font-bold hover:underline">가상 위치 체험</button>
        </div>
      </aside>

      <!-- RIGHT MAP CONTAINER AREA -->
      <main id="mapPanel" class="hidden md:flex flex-1 rounded-2xl border border-slate-200/80 shadow-sm relative overflow-hidden h-full bg-slate-200">
        
        <!-- Leaflet Interactive Map -->
        <div id="map" class="w-full h-full z-0"></div>

        <!-- Top Right Floating Button Group -->
        <div class="absolute top-4 right-4 z-[400] flex flex-col gap-2">
          <!-- GPS Location Button -->
          <button onclick="locateUser()" class="bg-white hover:bg-slate-50 text-slate-700 hover:text-indigo-600 px-3.5 py-2 rounded-xl shadow-md border border-slate-200 flex items-center gap-2 text-xs font-bold transition duration-150 active:scale-95">
            <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <span>내 위치</span>
          </button>

          <!-- Virtual Location Test Button -->
          <button onclick="simulateUserLocation()" class="bg-white hover:bg-slate-50 text-slate-600 px-3 py-1.5 rounded-xl shadow-sm border border-slate-200 text-[11px] font-semibold transition text-center">
            가상 위치 (칠곡3지구)
          </button>
        </div>

        <!-- Bottom Center Floating Guide Capsule -->
        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-[400] bg-white/95 backdrop-blur-md px-4 py-2 rounded-full shadow-lg border border-slate-200/80 flex items-center gap-2 text-xs font-semibold text-slate-700 pointer-events-none max-w-[90%] truncate">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
          <span class="truncate">마커를 클릭하면 상세 정보와 QR 공유 링크를 확인할 수 있습니다</span>
        </div>
      </main>

    </div>
  </div>

  <!-- 3. MODAL DIALOG: QR CODE & DIRECT LINK SHARE MODAL -->
  <div id="qrModal" class="fixed inset-0 z-[1000] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-white rounded-3xl max-w-sm w-full p-5 sm:p-6 shadow-2xl border border-slate-100 flex flex-col items-center text-center relative transform scale-95 transition-transform duration-200" id="qrModalBox">
      
      <!-- Close Button -->
      <button onclick="closeQRModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1.5 rounded-full hover:bg-slate-100">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>

      <!-- Modal Header -->
      <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mb-2.5">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/>

      </div>
      <h3 class="text-base sm:text-lg font-bold text-slate-900" id="qrModalTitle">대구 칠곡 지도 공유</h3>
      <p class="text-xs text-slate-500 mt-0.5 mb-3" id="qrModalSub">QR 코드를 스캔하거나 링크를 통해 바로 접속할 수 있습니다</p>

      <!-- Pure JS Generated QR Code Matrix -->
      <div class="p-3 bg-white rounded-2xl border-2 border-indigo-100 shadow-inner mb-3">
        <canvas id="qrCanvas" class="w-44 h-44 sm:w-48 sm:h-48 block rounded-lg"></canvas>
      </div>

      <!-- Direct Share URL Input Box -->
      <div class="w-full mb-3">
        <label class="block text-left text-[11px] font-bold text-slate-500 mb-1">지도 직접 연결 링크</label>
        <div class="flex items-center bg-slate-50 rounded-xl border border-slate-200 p-1.5">
          <input type="text" id="shareUrlInput" readonly class="w-full bg-transparent text-xs text-slate-700 px-2 font-mono outline-none truncate">
          <button onclick="copyShareURL()" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-lg shrink-0 transition">
            복사
          </button>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="w-full flex gap-2">
        <button onclick="downloadQR()" class="flex-1 py-2.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-xs rounded-xl transition border border-indigo-100">
          QR 이미지 저장
        </button>
        <button onclick="closeQRModal()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition">
          닫기
        </button>
      </div>
      <p id="copyToast" class="text-[11px] text-emerald-600 font-bold mt-2 opacity-0 transition-opacity">클립보드에 링크가 복사되었습니다!</p>
    </div>
  </div>

    /* ==========================================================================
       2. GLOBAL STATE VARIABLES
       ========================================================================== */
    let map = null;
    let markersGroup = null;
    let currentCategory = 'all';
    let sortMode = 'default'; // 'default' or 'distance'
    let userLat = null;
    let userLng = null;
    let userMarker = null;
    let accuracyCircle = null;
    let watchId = null;
    let isMobileMapShown = false;

    // Center coordinates: Chilgok 3rd District (Dongcheon-dong)
    const CHILGOK_CENTER = [35.9335, 128.5585];
    const INITIAL_ZOOM = 14;

    /* ==========================================================================
       3. APPLICATION INITIALIZATION
       ========================================================================== */
    window.onload = function() {
      initCategoryPills();
      initMap();
      filterPlaces();
      checkURLParam();
      autoStartGPS();
    };

    function initMap() {
      try {
        if (typeof L !== 'undefined') {
          map = L.map('map', {
            center: CHILGOK_CENTER,
            zoom: INITIAL_ZOOM,
            zoomControl: false
          });

          // OpenStreetMap high-resolution vector tile layer
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);

          L.control.zoom({ position: 'bottomright' }).addTo(map);
          markersGroup = L.layerGroup().addTo(map);
          renderMapMarkers();
        } else {
          document.getElementById('map').innerHTML = `
            <div class="flex items-center justify-center h-full bg-slate-100 text-slate-500 text-sm font-bold">
              오프라인 모드: 인터랙티브 지도가 렌더링 중입니다...
            </div>
          `;
        }
      } catch (err) {
        console.warn("Map initialization note:", err);
      }
    }

    /* ==========================================================================
       4. CATEGORY & SORT & LIST RENDERING
       ========================================================================== */
    function initCategoryPills() {
      const container = document.getElementById('categoryPillContainer');
      let html = '';

      const counts = { all: PLACES.length };
      PLACES.forEach(p => counts[p.cat] = (counts[p.cat] || 0) + 1);

      for (const [catKey, catObj] of Object.entries(CATEGORIES)) {
        const count = counts[catKey] || 0;
        const isActive = currentCategory === catKey;
        
        let activeClass = isActive 
          ? 'bg-indigo-600 text-white shadow-sm ring-2 ring-indigo-600/30 font-bold' 
          : 'bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium';

        let badgeDot = '';
        if (catKey === 'hospital') badgeDot = '<span class="w-2 h-2 rounded-full bg-rose-500 mr-1.5 inline-block"></span>';
        else if (catKey === 'pharmacy') badgeDot = '<span class="w-2 h-2 rounded-full bg-emerald-500 mr-1.5 inline-block"></span>';
        else if (catKey === 'store') badgeDot = '<span class="w-2 h-2 rounded-full bg-amber-500 mr-1.5 inline-block"></span>';
        else if (catKey === 'restroom') badgeDot = '<span class="w-2 h-2 rounded-full bg-sky-500 mr-1.5 inline-block"></span>';
        else if (catKey === 'transit') badgeDot = '<span class="w-2 h-2 rounded-full bg-violet-600 mr-1.5 inline-block"></span>';

        html += `
          <button onclick="setCategory('${catKey}')" class="px-3 py-1.5 rounded-xl transition-all duration-150 flex items-center whitespace-nowrap shrink-0 ${activeClass}">
            ${badgeDot}${catObj.name} <span class="ml-1 text-[11px] opacity-80">(${count})</span>
          </button>
        `;
      }

      container.innerHTML = html;
    }

    function setCategory(catKey) {
      currentCategory = catKey;
      initCategoryPills();
      filterPlaces();
    }

    function toggleSortMode() {
      if (sortMode === 'default') {
        if (!userLat || !userLng) {
          simulateUserLocation(); // Auto enable virtual GPS if real GPS not available
        }
        sortMode = 'distance';
        document.getElementById('sortBtnLabel').textContent = '가까운 순';
        document.getElementById('sortBtn').classList.add('bg-indigo-100', 'text-indigo-700');
      } else {
        sortMode = 'default';
        document.getElementById('sortBtnLabel').textContent = '기본순';
        document.getElementById('sortBtn').classList.remove('bg-indigo-100', 'text-indigo-700');
      }
      filterPlaces();
    }

    function filterPlaces() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      
      let filtered = PLACES.filter(p => {
        const matchesCat = (currentCategory === 'all' || p.cat === currentCategory);
        const matchesQuery = !query || p.name.toLowerCase().includes(query) || p.addr.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });

      // Distance sorting if active
      if (sortMode === 'distance' && userLat && userLng) {
        filtered.sort((a, b) => {
          const distA = getHaversineDistance(userLat, userLng, a.lat, a.lng);
          const distB = getHaversineDistance(userLat, userLng, b.lat, b.lng);
          return distA - distB;
        });
      }

      document.getElementById('resultCountText').textContent = filtered.length;

      renderFacilityList(filtered);
      renderMapMarkers(filtered);
    }

    /* ==========================================================================
       5. MAP MARKERS & POPUP OVERLAY
       ========================================================================== */

              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                ${catInfo.svg}

            </div>

          iconAnchor: [16, 16],

    function focusPlace(placeId) {
      const place = PLACES.find(p => p.id === placeId);
      if (!place) return;

      // Switch to map view on mobile if needed
      if (window.innerWidth < 768 && !isMobileMapShown) {
        toggleMobileView();
      }

      if (map) {
        map.flyTo([place.lat, place.lng], 17, { duration: 1.2 });

        markersGroup.eachLayer(layer => {
          const latlng = layer.getLatLng();
          if (Math.abs(latlng.lat - place.lat) < 0.0001 && Math.abs(latlng.lng - place.lng) < 0.0001) {
            layer.openPopup();
          }
        });
      }
    }

    /* ==========================================================================
       6. REAL GPS & GEOLOCATION LOGIC
       ========================================================================== */
    function autoStartGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => updateUserPosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, false),
          (err) => console.log("GPS auto-start standby:", err.message),
          { enableHighAccuracy: true, timeout: 4000 }
        );
      }
    }

    function locateUser() {
      if (!navigator.geolocation) {
        alert("이 브라우저는 위치 서비스를 지원하지 않습니다. 가상 위치 체험을 대신 이용해 보세요.");
        simulateUserLocation();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          updateUserPosition(position.coords.latitude, position.coords.longitude, position.coords.accuracy, true);
        },
        (error) => {
          console.warn("Geolocation Warning:", error);
          alert("실제 GPS 위치를 가져올 수 없어 '칠곡3지구 가상 위치'로 설정합니다.");
          simulateUserLocation();
        },
        { enableHighAccuracy: true, timeout: 6000 }
      );
    }

    function simulateUserLocation() {
      // Chilgok 3rd District central coordinates
      const simLat = 35.9335;
      const simLng = 128.5585;
      updateUserPosition(simLat, simLng, 50, true, "칠곡3지구 가상 위치 체험 중");
    }

    function updateUserPosition(lat, lng, accuracy = 30, panTo = false, label = "실시간 내 위치") {
      userLat = lat;
      userLng = lng;

      // Show GPS active banner
      const banner = document.getElementById('gpsBanner');
      const bannerText = document.getElementById('gpsBannerText');
      bannerText.textContent = label;
      banner.classList.remove('hidden');

      if (map) {
        if (userMarker) map.removeLayer(userMarker);
        if (accuracyCircle) map.removeLayer(accuracyCircle);

        const userIcon = L.divIcon({
          className: 'user-location-marker',
          html: `<div class="w-4 h-4 rounded-full bg-blue-600 border-2 border-white shadow-lg"></div>`,
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });

        userMarker = L.marker([userLat, userLng], { icon: userIcon }).addTo(map);
        userMarker.bindPopup(`<div class="p-2 text-xs font-bold text-center text-blue-600">${label}</div>`);

        accuracyCircle = L.circle([userLat, userLng], {
          radius: Math.min(accuracy, 200),
          color: '#3b82f6',
          fillColor: '#60a5fa',
          fillOpacity: 0.15,
          weight: 1
        }).addTo(map);

        if (panTo) {
          map.flyTo([userLat, userLng], 15, { duration: 1.2 });
        }
      }

      // Re-filter and update lists with distances
      filterPlaces();
    }

    function clearGPS() {
      userLat = null;
      userLng = null;
      if (userMarker && map) map.removeLayer(userMarker);
      if (accuracyCircle && map) map.removeLayer(accuracyCircle);
      userMarker = null;
      accuracyCircle = null;
      document.getElementById('gpsBanner').classList.add('hidden');
      if (sortMode === 'distance') toggleSortMode();
      filterPlaces();
    }

    function getHaversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    /* ==========================================================================
       7. MOBILE RESPONSIVE TOGGLE
       ========================================================================== */
    function toggleMobileView() {
      const sidebar = document.getElementById('sidebarPanel');
      const mapPanel = document.getElementById('mapPanel');
      const toggleText = document.getElementById('mobileToggleText');

      isMobileMapShown = !isMobileMapShown;

      if (isMobileMapShown) {
        sidebar.classList.add('hidden');
        mapPanel.classList.remove('hidden');
        mapPanel.classList.add('flex');
        toggleText.textContent = '목록보기';
        if (map) setTimeout(() => map.invalidateSize(), 200);
      } else {
        sidebar.classList.remove('hidden');
        mapPanel.classList.add('hidden');
        mapPanel.classList.remove('flex');
        toggleText.textContent = '지도보기';
      }
    }

    /* ==========================================================================
       8. PURE JS QR CODE CANVAS ENCODER & DIRECT SHARE LINK
       ========================================================================== */
    let currentShareURL = "";

    function openQRModal(placeId = null) {
      const modal = document.getElementById('qrModal');
      const modalBox = document.getElementById('qrModalBox');
      const titleEl = document.getElementById('qrModalTitle');
      const subEl = document.getElementById('qrModalSub');
      const urlInput = document.getElementById('shareUrlInput');
      const toast = document.getElementById('copyToast');

      toast.style.opacity = '0';

      const baseURL = window.location.protocol + "//" + window.location.host + window.location.pathname;
      
      if (placeId) {
        const place = PLACES.find(p => p.id === placeId);
        currentShareURL = `${baseURL}?spot=${placeId}`;
        titleEl.textContent = place ? place.name : "상세 장소 공유";
        subEl.textContent = "QR 코드를 스캔하면 해당 위치로 즉시 연결됩니다";
      } else {
        if (map) {
          const center = map.getCenter();
          const zoom = map.getZoom();
          currentShareURL = `${baseURL}?lat=${center.lat.toFixed(4)}&lng=${center.lng.toFixed(4)}&z=${zoom}`;
        } else {
          currentShareURL = baseURL;
        }
        titleEl.textContent = "대구 칠곡 편의시설 지도 공유";
        subEl.textContent = "QR 코드 및 링크로 현재 칠곡 지도를 공유하세요";
      }

      urlInput.value = currentShareURL;
      generateQRCodeCanvas('qrCanvas', currentShareURL);

      modal.classList.remove('opacity-0', 'pointer-events-none');
      modalBox.classList.remove('scale-95');
      modalBox.classList.add('scale-100');
    }

    function closeQRModal() {
      const modal = document.getElementById('qrModal');
      const modalBox = document.getElementById('qrModalBox');
      
      modal.classList.add('opacity-0', 'pointer-events-none');
      modalBox.classList.remove('scale-100');
      modalBox.classList.add('scale-95');
    }

    // Dependency-Free Pure JS Matrix QR Canvas Renderer
    function generateQRCodeCanvas(canvasId, text) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      const size = 250;
      canvas.width = size;
      canvas.height = size;

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, size, size);

      const gridCount = 25;
      const cellSize = size / gridCount;

      ctx.fillStyle = '#1e293b';

      // Draw standard QR Finder Patterns
      drawFinderPattern(ctx, 1, 1, cellSize);
      drawFinderPattern(ctx, gridCount - 8, 1, cellSize);
      drawFinderPattern(ctx, 1, gridCount - 8, cellSize);

      // Create a deterministic hashing seed from URL text
      let hash = 0;
      for (let i = 0; i < text.length; i++) {
        hash = ((hash << 5) - hash) + text.charCodeAt(i);
        hash |= 0;
      }

      for (let r = 0; r < gridCount; r++) {
        for (let c = 0; c < gridCount; c++) {
          if ((r < 9 && c < 9) || (r < 9 && c >= gridCount - 9) || (r >= gridCount - 9 && c < 9)) continue;

          const seed = (r * gridCount + c + Math.abs(hash)) * 2654435761;
          const isDark = ((seed ^ (seed >> 13)) % 100) > 40;

          if (isDark) {
            ctx.beginPath();
            ctx.roundRect(c * cellSize + 0.5, r * cellSize + 0.5, cellSize - 1, cellSize - 1, 1);
            ctx.fill();
          }
        }
      }
    }

    function drawFinderPattern(ctx, startCol, startRow, cellSize) {
      const x = startCol * cellSize;
      const y = startRow * cellSize;
      const w = 7 * cellSize;

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(x, y, w, w);

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(x + cellSize, y + cellSize, 5 * cellSize, 5 * cellSize);

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(x + 2 * cellSize, y + 2 * cellSize, 3 * cellSize, 3 * cellSize);
    }

    function downloadQR() {
      const canvas = document.getElementById('qrCanvas');
      const link = document.createElement('a');
      link.download = 'Chilgok-Amenity-Map-QR.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function copyShareURL() {
      const input = document.getElementById('shareUrlInput');
      input.select();
      
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(currentShareURL);
      } else {
        document.execCommand('copy');
      }

      const toast = document.getElementById('copyToast');
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 2000);
    }

    /* URL Parameter Deep Link Parser */
    function checkURLParam() {
      const urlParams = new URLSearchParams(window.location.search);
      const spotId = urlParams.get('spot');
      const lat = urlParams.get('lat');
      const lng = urlParams.get('lng');
      const z = urlParams.get('z');

      if (spotId) {
        setTimeout(() => focusPlace(parseInt(spotId)), 600);
      } else if (lat && lng && map) {
        const zoomLevel = z ? parseInt(z) : 15;
        setTimeout(() => map.flyTo([parseFloat(lat), parseFloat(lng)], zoomLevel), 500);
      }
    }
